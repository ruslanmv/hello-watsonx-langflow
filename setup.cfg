# ============================================================================
# setup.cfg - Additional Configuration
# ============================================================================

[metadata]
name = agent-langflow
version = 1.0.0
author = IBM watsonx.ai Team
author_email = support@ibm.com
description = LangFlow + IBM watsonx.ai Integration Demo
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ibm/watsonx-langflow-demo
license = MIT
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent

[options]
python_requires = >=3.11
install_requires =
    langflow>=1.0.0
    langchain>=0.1.0
    langchain-ibm>=0.1.0
    ibm-watsonx-ai>=1.1.0
    python-dotenv>=1.0.0

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-cov>=4.1.0
    black>=23.7.0
    flake8>=6.1.0
    mypy>=1.5.0

# ============================================================================
# flake8 Configuration
# ============================================================================
[flake8]
max-line-length = 100
exclude =
    .git,
    __pycache__,
    .venv,
    venv,
    build,
    dist,
    *.egg-info
ignore = E203, E266, E501, W503
max-complexity = 10
per-file-ignores =
    __init__.py:F401

# ============================================================================
# mypy Configuration (backup for non-pyproject.toml users)
# ============================================================================
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False

[mypy-langflow.*]
ignore_missing_imports = True

[mypy-langchain.*]
ignore_missing_imports = True

[mypy-langchain_ibm.*]
ignore_missing_imports = True

[mypy-ibm_watsonx_ai.*]
ignore_missing_imports = True
